<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rohit Study Point</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FFC700">
<style>
:root{--y:#FFC700;--k:#14110a;--c:#FFF6D6;--p:#5B2EC0;--o:#FF7A1A;--w:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:var(--c);color:var(--k);padding-bottom:92px;max-width:520px;margin:0 auto}
header{background:var(--y);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;position:sticky;top:0;z-index:5;border-radius:0 0 22px 22px}
.row{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--k);color:var(--y);display:grid;place-items:center;font-weight:800}
.brand{flex:1;line-height:1.1}.brand b{font-size:16px}.brand small{display:block;font-size:10px}
select{border:2px solid var(--k);background:var(--y);border-radius:10px;padding:4px;font-weight:700}
.ib{font-size:20px;background:none;border:0}
main{padding:14px}
.note{background:#fff;border:1px dashed var(--o);color:#8a3b00;font-size:12px;padding:8px 10px;border-radius:10px;margin-bottom:12px}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:20px;padding:20px;color:#fff;min-height:140px;display:flex;flex-direction:column;justify-content:center}
.slide h2{font-size:21px;line-height:1.2}.slide p{font-size:13px;margin-top:6px;opacity:.95}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 14px}.dots i{width:7px;height:7px;border-radius:9px;background:#0003}.dots i.on{width:20px;background:var(--k)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.quick button{background:var(--k);color:var(--y);border:0;border-radius:18px;padding:16px 4px;font-weight:700;font-size:13px}
.quick span{display:block;font-size:28px;margin-bottom:4px}
h3{font-size:17px;margin:16px 0 10px}
.card{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px #0002}
.thumb{height:92px;padding:12px;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:flex-end}
.body{padding:12px}.meta{font-size:12px;color:#555;margin:3px 0}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:2px solid var(--k);background:#fff;border-radius:12px;padding:9px;font-weight:700;font-size:13px}
.btn.dk{background:var(--k);color:var(--y)}.btn.wa{background:#25D366;border-color:#25D366;color:#fff;flex:0 0 44px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px}
.Active{background:#d7f5dc;color:#116b2a}.Expired{background:#fde0e0;color:#a11}.Upcoming{background:#e6dcff;color:var(--p)}
.price b{font-size:18px}.price s{color:#888;margin:0 6px;font-size:13px}.price em{color:#0a7a2f;font-style:normal;font-weight:700;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;border:2px solid var(--k);background:#fff;border-radius:20px;padding:6px 13px;font-weight:700;font-size:13px}.chip.on{background:var(--k);color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .thumb{height:96px;font-size:30px;justify-content:center;align-items:center}
input[type=search]{width:100%;padding:11px 14px;border-radius:14px;border:2px solid var(--k);font-size:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{background:var(--k);color:var(--y);border-radius:14px;padding:10px 2px;text-align:center;font-size:11px}.stats b{display:block;font-size:19px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;box-shadow:0 -3px 14px #0003;z-index:9}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#444;width:19%}
nav i{font-style:normal;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px}
nav .on{color:var(--k)}nav .on i{background:var(--k);filter:none}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--k);color:var(--y);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<header><div class="row"><button class="ib" onclick="t('मेन्यू')">☰</button><div class="logo">R</div>
<div class="brand"><b>Rohit Study Point</b><small>Learn Smart. Practice More.</small></div>
<select id="cls" onchange="t('क्लास बदली: '+this.value)"><option>Class 10</option><option>12 Science</option><option>12 Arts</option><option>12 Commerce</option></select>
<button class="ib" onclick="t('सर्च जल्द आएगा')">🔍</button><button class="ib" onclick="t('कोई नई सूचना नहीं')">🔔</button></div></header>
<main id="app"></main>
<nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function t(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>e.classList.remove('on'),1800)}
const NOTE='<div class="note">⚠️ यह प्रोटोटाइप है। सारा डेटा सैंपल है, असली कोर्स/कीमतें ओनर पैनल से आएँगी।</div>';
const C=[
{t:'Bihar Board 2027 – Class 10 Complete',k:'10',s:'सभी विषय',p:999,o:1999,g:'#5B2EC0,#9B6BFF',st:'Active',e:'31 Mar 2027'},
{t:'Class 12 Science – Physics + Chemistry',k:'12S',s:'Science',p:1499,o:2999,g:'#FF7A1A,#FFB347',st:'Active',e:'31 Mar 2027'},
{t:'Class 12 Arts – History + Pol. Science',k:'12A',s:'Arts',p:799,o:1599,g:'#0E7C66,#3CC9A8',st:'Upcoming',e:'30 Apr 2027'},
{t:'Class 12 Commerce – Accountancy',k:'12C',s:'Commerce',p:899,o:1799,g:'#C2185B,#F06292',st:'Expired',e:'31 Mar 2026'},
{t:'Crash Course – Last 30 Days',k:'Crash',s:'सभी स्ट्रीम',p:499,o:999,g:'#14110a,#5a4a10',st:'Active',e:'15 Feb 2027'},
{t:'Free Demo – Maths Basics',k:'Free',s:'Class 10',p:0,o:0,g:'#1565C0,#64B5F6',st:'Active',e:'Lifetime'}];
const P=[['📘','Class 10 Science Guide',250,399],['📗','12th Physics Question Bank',299,499],['📙','Model Papers 2027',199,349],['✏️','Stationery Combo',99,150]];
const T=[['Free Test','Class 10 Maths – Ch.1','20 प्रश्न · 30 मिनट'],['Chapter Test','Physics – विद्युत','25 प्रश्न · 40 मिनट'],['Mock Exam','Full Length Mock-1','100 प्रश्न · 3 घंटे'],['PYQ Test','2025 प्रश्नपत्र','50 प्रश्न · 90 मिनट']];
const L=[['Maths – त्रिकोणमिति','आज 5:00 PM'],['Physics – प्रकाश','कल 4:00 PM']];
const off=c=>c.o?Math.round((1-c.p/c.o)*100):0;
const WA='<button class="btn wa" onclick="t(\'WhatsApp नंबर ओनर पैनल से जुड़ेगा\')">💬</button>';
function cc(c,m){const th=`<div class="thumb" style="background:linear-gradient(135deg,${c.g})">${c.t}</div>`;
let x=`<div class="card">${th}<div class="body"><div class="meta">${c.k==='Free'?'':'Class '}${c.s} · Session 2026-27</div>`;
if(m==='my')x+=`<span class="badge ${c.st}">${c.st}</span><div class="meta">Expiry: ${c.e}</div><div class="btns"><button class="btn" onclick="t('डिटेल्स')">Details</button><button class="btn dk" onclick="t('कंटेंट: चैप्टर, वीडियो, PDF चरण 2-3 में')">Content</button>${WA}</div>`;
else if(m==='all')x+=`<div class="price"><b>${c.p?'₹'+c.p:'Free'}</b>${c.o?`<s>₹${c.o}</s><em>${off(c)}% OFF</em>`:''}</div><div class="btns"><button class="btn" onclick="t('डिटेल्स')">Details</button><button class="btn dk" onclick="t('पेमेंट चरण 5 में जुड़ेगा')">Buy Now</button></div>`;
else x+=`<div class="meta">Expiry: ${c.e}</div><div class="btns"><button class="btn" onclick="t('डिटेल्स')">Details</button><button class="btn dk" onclick="t('कंटेंट जल्द')">Content</button>${WA}</div>`;
return x+'</div></div>'}
let cat='All';
const V={
home(){return NOTE+`<div class="slider" id="sl">${[['Bihar Board 2027 Batch','नया बैच शुरू – अभी जुड़ें','#5B2EC0,#9B6BFF'],['Crash Course','आख़िरी 30 दिन की तैयारी','#FF7A1A,#FFB347'],['Topper Results','हमारे छात्रों की सफलता','#14110a,#4a3a08']].map(b=>`<div class="slide" style="background:linear-gradient(135deg,${b[2]})" onclick="go('all')"><h2>${b[0]}</h2><p>${b[1]}</p></div>`).join('')}</div><div class="dots" id="dt"><i class="on"></i><i></i><i></i></div>
<div class="quick"><button onclick="go('all')"><span>📚</span>All Courses</button><button onclick="t('Live Class चरण 3 में')"><span>🎥</span>Live Class</button><button onclick="t('Notes चरण 1-2 में')"><span>📄</span>Notes</button></div>
<h3>Latest Courses</h3>${C.slice(0,3).map(c=>cc(c)).join('')}
<h3>Upcoming Live Classes</h3>${L.map(l=>`<div class="card"><div class="body"><b>${l[0]}</b><div class="meta">${l[1]}</div></div></div>`).join('')}`},
my(){return NOTE+'<h3>My Courses</h3>'+C.filter(c=>c.st).slice(0,4).map(c=>cc(c,'my')).join('')},
all(){const cs=['All','10','12S','12A','12C','Crash','Free'],nm={All:'सभी','10':'Class 10','12S':'12 Science','12A':'12 Arts','12C':'12 Commerce',Crash:'Crash',Free:'Free'};
return NOTE+`<div class="chips">${cs.map(k=>`<button class="chip ${k===cat?'on':''}" onclick="cat='${k}';go('all')">${nm[k]}</button>`).join('')}</div>`+C.filter(c=>cat==='All'||c.k===cat).map(c=>cc(c,'all')).join('')},
store(){return NOTE+`<h3>Welcome to Store</h3><input type="search" placeholder="किताबें खोजें..."><div class="slide" style="background:linear-gradient(135deg,#FF7A1A,#FFB347);margin-bottom:14px"><h2>Model Papers 2027</h2><p>नई किताबें – 40% तक छूट</p></div><div class="grid">${P.map(p=>`<div class="card"><div class="thumb" style="background:#FFE9A8">${p[0]}</div><div class="body"><b style="font-size:13px">${p[1]}</b><div class="price"><b>₹${p[2]}</b><s>₹${p[3]}</s></div><button class="btn dk" style="width:100%;margin-top:8px" onclick="t('कार्ट/पेमेंट चरण 5 में')">Buy Now</button></div></div>`).join('')}</div>`},
tests(){return NOTE+`<h3>Your Performance</h3><div class="stats"><div><b>0</b>Attempted</div><div><b>0%</b>Avg Score</div><div><b>0</b>Correct</div><div><b>–</b>Rank</div></div><h3>Tests</h3>`+T.map(x=>`<div class="card"><div class="body"><span class="badge Upcoming">${x[0]}</span><div style="font-weight:700;margin-top:6px">${x[1]}</div><div class="meta">${x[2]}</div><div class="btns"><button class="btn dk" onclick="t('क्विज़ इंजन चरण 3 में')">Start Test</button></div></div></div>`).join('')}};
const TABS=[['home','🏠','Home'],['my','🎓','My Course'],['all','📚','All Courses'],['store','🛒','Store'],['tests','📝','Tests']];
function go(k){$('#app').innerHTML=V[k]();$('#nav').innerHTML=TABS.map(b=>`<button class="${b[0]===k?'on':''}" onclick="go('${b[0]}')"><i>${b[1]}</i>${b[2]}</button>`).join('');
document.querySelectorAll('nav .on i').forEach(i=>i.style.cssText='background:#14110a;box-shadow:0 0 0 0 #0000');
scrollTo(0,0);const s=$('#sl');if(s)s.onscroll=()=>{const n=Math.round(s.scrollLeft/s.clientWidth);document.querySelectorAll('#dt i').forEach((d,i)=>d.classList.toggle('on',i===n))}}
go('home');
setInterval(()=>{const s=$('#sl');if(s){const n=(Math.round(s.scrollLeft/s.clientWidth)+1)%3;s.scrollTo({left:n*s.clientWidth,behavior:'smooth'})}},3500);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
